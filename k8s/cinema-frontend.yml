apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema-frontend
  namespace: v3-cinema
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cinema-frontend
  template:
    metadata:
      labels:
        app: cinema-frontend
    spec:
      containers:
        - name: cinema-frontend
          image: cinema-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cinema-frontend
  namespace: v3-cinema
spec:
  type: ClusterIP
  selector:
    app: cinema-frontend
  ports:
    - port: 80
      targetPort: 80
