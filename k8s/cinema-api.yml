apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema-api
  namespace: v3-cinema
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cinema-api
  template:
    metadata:
      labels:
        app: cinema-api
    spec:
      containers:
        - name: cinema-api
          image: cinema-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CINEMA_DEMO
              value: "1"
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cinema-api
  namespace: v3-cinema
spec:
  type: ClusterIP
  selector:
    app: cinema-api
  ports:
    - port: 8000
      targetPort: 8000
